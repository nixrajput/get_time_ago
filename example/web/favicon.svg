<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 32 32">
  <title>get_time_ago</title>
  <rect width="32" height="32" rx="7" fill="#141118" />
  <!-- A clock face with the elapsed span lit, which is what the package prints: the event
       (amber dot) back at nine, now (violet hand) at twelve, and the amber arc between them
       is the "ago". Same tile and palette as mcp-vitest and ai-sdk-threads. -->
  <circle cx="16" cy="16" r="9.5" fill="none" stroke="#6b6478" stroke-width="2.2" />
  <path d="M6.5 16 A9.5 9.5 0 0 1 16 6.5" fill="none" stroke="#f0a868" stroke-width="2.8" stroke-linecap="round" />
  <circle cx="6.5" cy="16" r="2.1" fill="#f0a868" />
  <path d="M16 16 V9.8" stroke="#9b8cff" stroke-width="2.4" stroke-linecap="round" />
  <circle cx="16" cy="16" r="1.9" fill="#9b8cff" />
</svg>
