name: Bug Report
description: File a bug report for get_time_ago
title: "[Bug]: "
labels: ["bug"]
assignees: ["nixrajput"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report.
        Before submitting, please check the [existing issues](https://github.com/nixrajput/get_time_ago/issues) to avoid duplicates. Upgrading from 2.x? [MIGRATION.md](https://github.com/nixrajput/get_time_ago/blob/master/MIGRATION.md) covers every change.

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      description: Which part of get_time_ago is affected?
      multiple: false
      options:
        - Wrong text in a built-in locale
        - Custom locales (registerLocale, TimeAgoMessages)
        - Styles and units (TimeAgoStyle, TimeUnit)
        - The full date (datePattern)
        - Clock and time zones
        - Refreshing the text (nextChange)
        - Types / API
        - Other
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug clearly. What did you see, and what did you expect?
      placeholder: "Expected: 5 minutes ago. Actual: ..."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: A minimal snippet, with the exact DateTime you passed. Smaller repros get fixed faster.
      placeholder: |
        1. `GetTimeAgo.parse(DateTime.now().subtract(const Duration(minutes: 5)), locale: 'fr')`
        2. See the wrong text
    validations:
      required: true

  - type: input
    id: locale
    attributes:
      label: Locale
      description: The locale code you passed, if any.
      placeholder: "e.g. fr, zh_tw"

  - type: input
    id: version
    attributes:
      label: get_time_ago version
      description: The version you are running.
      placeholder: "e.g. 3.0.0"
    validations:
      required: true

  - type: textarea
    id: sdk
    attributes:
      label: Dart or Flutter version
      description: Output of `dart --version`, or `flutter --version` in a Flutter app.
      render: shell
    validations:
      required: true

  - type: dropdown
    id: platforms
    attributes:
      label: Platforms
      description: Where do you see the bug?
      multiple: true
      options:
        - Android
        - iOS
        - Web
        - macOS
        - Windows
        - Linux
        - Server / CLI (Dart VM)
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or error output
      description: Paste the error or stack trace. Formatted as code.
      render: shell

  - type: checkboxes
    id: conduct
    attributes:
      label: Code of Conduct
      description: By submitting this issue you agree to follow our [Code of Conduct](https://github.com/nixrajput/get_time_ago/blob/master/CODE_OF_CONDUCT.md).
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true
