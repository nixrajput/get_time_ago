name: Feature Request
description: Suggest an improvement or new feature for get_time_ago
title: "[Feature Request]: "
labels: ["enhancement"]
assignees: ["nixrajput"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature!
        Before submitting, check [existing issues](https://github.com/nixrajput/get_time_ago/issues) and [discussions](https://github.com/nixrajput/get_time_ago/discussions) to see if it has already been proposed.

  - type: dropdown
    id: area
    attributes:
      label: Scope / area
      description: Which part of get_time_ago does this relate to?
      multiple: false
      options:
        - A new built-in locale
        - Custom locales
        - Styles and units
        - The full date
        - Clock and time zones
        - Refreshing the text
        - Types / API ergonomics
        - Docs / demo app
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What problem does this feature solve? Why is it needed? For a new locale, give its language code.
      placeholder: "When showing relative times, I find it hard to ..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the feature you would like to see. A sketch of the code you wish you could write helps most.
      placeholder: |
        ```dart
        // the API I wish existed
        GetTimeAgo.parse(date, ...)
        ```
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds you use today, or alternative approaches you have thought about?

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Any other information or references that would help.

  - type: checkboxes
    id: conduct
    attributes:
      label: Code of Conduct
      description: By submitting this issue you agree to follow our [Code of Conduct](https://github.com/nixrajput/get_time_ago/blob/master/CODE_OF_CONDUCT.md).
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true
