name: Release

# On push to the default branch (a merged PR): if the pubspec version isn't yet
# tagged, create the tag v<version> and a GitHub Release. The tag then triggers
# publish.yml, which publishes to pub.dev FROM A TAG REF (pub.dev's automated
# publishing only allows the 'tag' refType, not 'branch').
#
# The tag is pushed with RELEASE_PAT so it triggers publish.yml — a tag pushed
# by the default GITHUB_TOKEN does NOT trigger other workflows. If RELEASE_PAT is
# not set, the tag is still created with the default token (so the GitHub Release
# is cut), but publish.yml won't fire automatically; push the tag manually once
# to publish, or add the RELEASE_PAT secret to enable full automation.
on:
  push:
    branches: ["master"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  release:
    name: Tag and release
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag + GitHub Release
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Read version
        id: v
        run: |
          version=$(grep -E '^version:' pubspec.yaml | head -1 | awk '{print $2}' | tr -d '\r')
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Create tag + release if new
        env:
          # Prefer RELEASE_PAT so the pushed tag triggers publish.yml; fall back
          # to GITHUB_TOKEN (tag is created, publish must be triggered manually).
          GH_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
            echo "Tag $TAG already exists — skipping."
            exit 0
          fi
          # gh release create makes the tag AND the GitHub Release in one step.
          gh release create "$TAG" --target "${{ github.sha }}" --title "$TAG" --generate-notes
          echo "Released $TAG ✓ (publish.yml handles pub.dev on the tag)"
