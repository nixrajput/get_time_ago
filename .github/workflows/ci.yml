name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      # Use Flutter (it bundles the Dart SDK) so packages whose example/ depends
      # on flutter_test resolve correctly; dart-only packages still work.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install dependencies
        run: flutter pub get
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: dart analyze
      - name: Test
        # UTC dates must render in local time, which a UTC runner cannot show.
        run: TZ=Asia/Kolkata dart test
      - name: Test on the web (dart2js and dart2wasm)
        # Tests that read repository files are @TestOn('vm') and skip here.
        run: |
          dart test -p chrome
          dart test -p chrome -c dart2wasm
      - name: Coverage
        run: |
          dart pub global activate coverage
          dart test --coverage=coverage
          dart pub global run coverage:format_coverage \
            --lcov --in=coverage --out=coverage/lcov.info \
            --report-on=lib --check-ignore
          scripts/coverage.sh 90
