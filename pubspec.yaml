name: get_time_ago
description: Relative time for Dart and Flutter, such as "just now", "5 minutes ago" or "in 3 days", in 22 locales with CLDR plurals, short styles and an injectable clock.

version: 3.0.1

homepage: https://pub.dev/packages/get_time_ago
repository: https://github.com/nixrajput/get_time_ago
issue_tracker: https://github.com/nixrajput/get_time_ago/issues

environment:
  sdk: ^3.13.0

dependencies:
  intl: ">=0.19.0 <0.21.0"

dev_dependencies:
  lints: ^6.1.0
  test: ^1.31.0

topics:
  - time-ago
  - timeago
  - relative-time
  - datetime
  - i18n

funding:
  - https://ko-fi.com/nixrajput
  - https://www.buymeacoffee.com/nixrajput
  - https://github.com/sponsors/nixrajput
